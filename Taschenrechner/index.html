<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taschenrechner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div id="ergebnis"></div>
      <button data-key="7" class="numbers">7</button>
      <button data-key="8" class="numbers">8</button>
      <button data-key="9" class="numbers">9</button>
      <button data-key="/" class="operator">/</button>
      <button data-key="." class="operator">.</button>
      <button id="prozent">%</button>
      <button data-key="4" class="numbers">4</button>
      <button data-key="5" class="numbers">5</button>
      <button data-key="6" class="numbers">6</button>
      <button data-key="*" class="operator">*</button>
      <button id="quadrat">
        <span>x²</span>
      </button>
      <button id="wurzel">√</button>
      <button data-key="1" class="numbers">1</button>
      <button data-key="2" class="numbers">2</button>
      <button data-key="3" class="numbers">3</button>
      <button data-key="-" class="operator">-</button>
      <button data-key="Backspace" id="backspace">←</button>
      <button data-key="Enter" id="gleich">=</button>
      <button data-key="(" class="operator">(</button>
      <button data-key="0" class="numbers">0</button>
      <button data-key=")" class="operator">)</button>
      <button data-key="+" class="operator">+</button>
      <button data-key="Escape" id="delete">C</button>
    </div>
  </body>
  <script src="app.js"></script>
</html>
